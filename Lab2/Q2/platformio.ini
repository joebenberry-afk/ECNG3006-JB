; ECNG3006 Lab 2 - Question 2: three FreeRTOS tasks sharing an LED via a mutex
; Build + flash:  pio run -t upload      Serial:  pio device monitor

[env:mkrzero]
platform = atmelsam
board = mkrzero
framework = arduino
monitor_speed = 115200
lib_deps = briscoetech/FreeRTOS_SAMD21 @ ^2.3.0
; make the library use include/FreeRTOSConfig.h (see use_my_config.py)
extra_scripts = pre:use_my_config.py
