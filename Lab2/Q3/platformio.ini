; ECNG3006 Lab 2 - Question 3: relative task performance under four scheduler setups
; Build + flash one case:  pio run -e same -t upload     (or case_a / case_b / case_c)
; Watch it:                pio device monitor            (USB serial, COM port of the board)

[env]
platform = atmelsam
board = mkrzero
framework = arduino
monitor_speed = 115200
lib_deps = briscoetech/FreeRTOS_SAMD21 @ ^2.3.0
; make the library use include/FreeRTOSConfig.h (see use_my_config.py)
extra_scripts = pre:use_my_config.py

; all three tasks SAME priority, run to completion (co-operative)
[env:same]
build_flags = -DAPP_PREEMPTION=0 -DUSE_MUTEX=1 -DSAME_PRIO -DCASE_NAME=\"same\"

; a) T1 > T2 > T3, run to completion (co-operative)
[env:case_a]
build_flags = -DAPP_PREEMPTION=0 -DUSE_MUTEX=1 -DCASE_NAME=\"case_a\"

; b) T1 > T2 > T3, preemptive, NO priority inheritance (binary semaphore)
[env:case_b]
build_flags = -DAPP_PREEMPTION=1 -DUSE_MUTEX=0 -DCASE_NAME=\"case_b\"

; c) T1 > T2 > T3, preemptive, priority inheritance (FreeRTOS mutex)
[env:case_c]
build_flags = -DAPP_PREEMPTION=1 -DUSE_MUTEX=1 -DCASE_NAME=\"case_c\"
